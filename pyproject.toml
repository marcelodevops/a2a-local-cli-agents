[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "a2a-local-cli-agents"
version = "0.1.0"
description = "Antigravity, Qoder and Copilot CLI agents interacting over local A2A"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[http-server]>=1.3,<1.4",
    "httpx>=0.28,<1",
    "starlette>=0.46,<2",
    "uvicorn>=0.34,<1",
]

[project.scripts]
a2a-local = "a2a_local.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_local"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
